name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Write Google config
        shell: pwsh
        run: |
          Set-Content -Encoding utf8 src/lib/config.js "export const GOOGLE_CLIENT_ID = '${{ secrets.GOOGLE_CLIENT_ID }}';"
          Add-Content -Encoding utf8 src/lib/config.js "export const GOOGLE_CLIENT_SECRET = '${{ secrets.GOOGLE_CLIENT_SECRET }}';"

      - name: Signing key check
        shell: pwsh
        run: |
          $k = "$env:TAURI_SIGNING_PRIVATE_KEY"
          $bytes = [Text.Encoding]::UTF8.GetBytes($k.Trim())
          $hash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace("-", "").ToLower()
          $pwlen = "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD".Length
          Write-Output "::error title=SigningKeyCheck::keylen=$($k.Length) keyhash=$hash pwlen=$pwlen"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RikaVPN ${{ github.ref_name }}"
          releaseBody: "تحديث جديد لبرنامج RikaVPN — انظر المرفقات."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
